<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apply For Internship</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    text-align:center;
    padding:25px;
}

header h1{
    color:#60a5fa;
}

.application-section{
    max-width:700px;
    margin:50px auto;
    background:#1e293b;
    padding:35px;
    border-radius:15px;
}

.application-section h2{
    text-align:center;
    margin-bottom:30px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:none;
    border-radius:8px;
    background:#334155;
    color:white;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2563eb;
}

.success{
    display:none;
    margin-top:20px;
    padding:15px;
    background:#14532d;
    border-radius:8px;
    text-align:center;
}

.back{
    text-align:center;
    margin-top:30px;
}

.back a{
    text-decoration:none;
    color:white;
    background:#334155;
    padding:12px 24px;
    border-radius:8px;
}

.back a:hover{
    background:#475569;
}

</style>
</head>

<body>

<header>
    <h1>SkillBridge Internship Application</h1>
</header>

<section class="application-section">

    <h2>Apply For Internship</h2>

    <form onsubmit="submitForm(event)">

        <input
        type="text"
        placeholder="Full Name"
        required>

        <input
        type="email"
        placeholder="Email Address"
        required>

        <input
        type="tel"
        placeholder="Phone Number"
        required>

        <input
        type="text"
        placeholder="College Name"
        required>

        <input
        type="text"
        placeholder="Branch / Department"
        required>

        <select required>
            <option value="">
                Select Internship Domain
            </option>

            <option>
                Web Development
            </option>

            <option>
                Python Development
            </option>

            <option>
                Java Development
            </option>

            <option>
                UI/UX Designing
            </option>

            <option>
                Cyber Security
            </option>

            <option>
                Data Science
            </option>

            <option>
                Cloud Computing
            </option>

        </select>

        <input
        type="file">

        <textarea
        rows="4"
        placeholder="Why are you interested in this internship?">
        </textarea>

        <button type="submit">
            Submit Application
        </button>

    </form>

    <div class="success" id="successMessage">

        ✅ Application Submitted Successfully!

        <br><br>

        Our team will contact you soon.

    </div>

</section>

<div class="back">
    <a href="internships.html">
        ← Back to Internships
    </a>
</div>

<script>

function submitForm(event){

    event.preventDefault();

    document.getElementById("successMessage").style.display="block";

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });

}

</script>

</body>
</html>
